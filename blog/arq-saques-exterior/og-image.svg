<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ARQ para saques no exterior sem IOF</title>
  <desc id="desc">Cartão ARQ Global com destaque para zero por cento de IOF, saque de um por cento, caixa eletrônico e DCC.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06090f"/>
      <stop offset="1" stop-color="#111b24"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1ce6a4"/>
      <stop offset="1" stop-color="#0da978"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1025" cy="95" r="250" fill="#1ce6a4" opacity=".07"/>
  <circle cx="1100" cy="610" r="340" fill="#38bdf8" opacity=".05"/>

  <g transform="translate(72 82)">
    <rect width="620" height="466" rx="32" fill="#0d141d" stroke="#263341" stroke-width="3" filter="url(#shadow)"/>
    <rect x="52" y="48" width="516" height="240" rx="22" fill="#111d28" stroke="#344555" stroke-width="2"/>
    <rect x="88" y="82" width="444" height="128" rx="14" fill="#07100e"/>
    <text x="310" y="138" fill="#1ce6a4" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">ESCOLHA A MOEDA LOCAL</text>
    <text x="310" y="178" fill="#b8c7d4" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle">RECUSAR CONVERSÃO DO CAIXA</text>
    <rect x="188" y="250" width="244" height="16" rx="8" fill="#263846"/>
    <rect x="126" y="330" width="368" height="68" rx="12" fill="#182633"/>
    <rect x="160" y="354" width="300" height="18" rx="9" fill="#9fd8c5" opacity=".62"/>
  </g>

  <g transform="translate(565 285) rotate(-7 235 150)" filter="url(#shadow)">
    <rect width="470" height="300" rx="28" fill="url(#card)"/>
    <circle cx="397" cy="64" r="22" fill="none" stroke="#062a20" stroke-width="6"/>
    <path d="M420 45c16 11 16 27 0 38" fill="none" stroke="#062a20" stroke-width="6" stroke-linecap="round"/>
    <text x="42" y="82" fill="#05251c" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800">ARQ</text>
    <text x="42" y="126" fill="#0a4938" font-family="Arial, Helvetica, sans-serif" font-size="20">antes DolarApp</text>
    <rect x="42" y="164" width="158" height="54" rx="27" fill="#05251c"/>
    <text x="121" y="201" fill="#dffbf1" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" text-anchor="middle">0% IOF</text>
    <text x="42" y="260" fill="#05251c" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">DINHEIRO EM VIAGEM</text>
  </g>

  <text x="735" y="78" fill="#f2f7fb" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800">ARQ PARA SAQUES</text>
  <text x="735" y="132" fill="#f2f7fb" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800">NO EXTERIOR</text>
  <text x="738" y="178" fill="#9fb1c1" font-family="Arial, Helvetica, sans-serif" font-size="26">0% IOF · saque 1% · ATM · DCC</text>
  <text x="1128" y="590" fill="#f2f7fb" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">DLT ACADEMY</text>
</svg>
