    <text x="34" y="182" fill="#61e7a8" font-family="Arial, sans-serif" font-size="21">varia de link para link</text>
  </g>
  <text x="84" y="92" fill="#61e7a8" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="4">DLT ACADEMY · CASHBACK E INDICAÇÃO</text>
  <text x="84" y="192" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="67" font-weight="800">CÓDIGO DE</text>
  <text x="84" y="272" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="57" font-weight="750">INDICAÇÃO BINANCE</text>
  <text x="84" y="340" fill="#aebdca" font-family="Arial, sans-serif" font-size="30">Quanto devolve · por quanto tempo</text>
  <rect x="84" y="390" width="560" height="96" rx="20" fill="#61e7a8"/>
  <text x="112" y="432" fill="#06110d" font-family="Arial, sans-serif" font-size="26" font-weight="800">CONFIRA NO CADASTRO ANTES</text>
  <text x="112" y="462" fill="#18372a" font-family="Arial, sans-serif" font-size="18">o percentual e a duração dependem do link</text>
  <text x="84" y="560" fill="#74889a" font-family="Arial, sans-serif" font-size="17">Regras oficiais consultadas em 29/09/2026. Condições podem mudar.</text>
