<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Código de indicação da Binance</title>
  <desc id="desc">Parte da taxa volta para você, e o percentual muda de link para link.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06090f"/>
      <stop offset="1" stop-color="#101b2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61e7a8"/>
      <stop offset="1" stop-color="#5eb5ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1035" cy="90" r="210" fill="#61e7a8" opacity="0.07"/>
  <circle cx="1120" cy="520" r="280" fill="#5eb5ff" opacity="0.06"/>
  <g transform="translate(760 250)">
    <rect x="0" y="0" width="330" height="200" rx="28" fill="#111c2a" stroke="#2b4054" stroke-width="2"/>
    <text x="34" y="70" fill="#aebdca" font-family="Arial, sans-serif" font-size="24">Taxa da ordem</text>
    <rect x="34" y="88" width="262" height="14" rx="7" fill="#22384c"/>
    <rect x="34" y="88" width="64" height="14" rx="7" fill="url(#accent)"/>
