    <rect x="52" y="48" width="516" height="240" rx="22" fill="#111d28" stroke="#344555" stroke-width="2"/>
    <rect x="88" y="82" width="444" height="128" rx="14" fill="#07100e"/>
    <text x="310" y="136" fill="#1ce6a4" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" text-anchor="middle">US$100 NO EXTERIOR</text>
