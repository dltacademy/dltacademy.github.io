  <text x="738" y="172" fill="#9fb1c1" font-family="Arial, Helvetica, sans-serif" font-size="25">bruto · funding · cashback elegível</text>
  <text x="1128" y="590" fill="#f2f7fb" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">DLT ACADEMY</text>
